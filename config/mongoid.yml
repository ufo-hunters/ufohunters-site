development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGOHQ_URL', 'mongodb://localhost:27017/ufosightings') %>
      options:
        server_selection_timeout: 1
  options:
    raise_not_found_error: false

test:
  clients:
    default:
      # MONGO_TEST_URL lets the suite run against another server, e.g. the
      # MongoDB upgrade mirror (docker-compose.mongo-upgrade.yml).
      uri: <%= ENV.fetch('MONGO_TEST_URL', 'mongodb://localhost:27017/sightings_test') %>
      options:
        max_retries: 1
        retry_interval: 0
  options:
    raise_not_found_error: false

production:
  clients:
    default:
      uri: <%= ENV['MONGOHQ_URL'] %>
  options:
    raise_not_found_error: false
